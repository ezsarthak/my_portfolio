<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Portfolio of Sarthak Patil - Flutter + Backend + AI | Startup Founder">
  <meta name="keywords" content="Sarthak Patil, Portfolio, Flutter, Backend, AI, Startup Founder">
  <meta name="author" content="Sarthak Patil">

  <!-- Open Graph -->
  <meta property="og:title" content="Sarthak Patil | Portfolio">
  <meta property="og:description" content="Flutter + Backend + AI | Startup Founder">
  <meta property="og:type" content="website">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Sarthak Patil">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Google Fonts & CanvasKit Preconnect -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://www.gstatic.com" crossorigin>

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <!-- Flutter Web Renderer Configuration is handled in flutter_bootstrap.js -->

  <title>Sarthak Patil | Portfolio</title>
  <link rel="manifest" href="manifest.json">

  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #11071F; /* Match exactly with AppColors.bgColor */
    }

    #typographic-loader {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-color: #11071F;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      opacity: 1;
      transition: opacity 0.8s ease-out;
      pointer-events: none; /* Let clicks pass through when fading out */
    }

    .loader-content {
      width: 100%;
      padding-bottom: 50px;
      box-sizing: border-box;
    }

    #num {
      font-family: 'Inter', sans-serif;
      font-size: 15vw;
      font-weight: bold;
      color: white;
      line-height: 1;
      letter-spacing: -5px;
      margin-left: 5vw;
    }

    #bar-container {
      width: 100%;
      height: 2px;
      background-color: transparent;
      margin-top: 10px;
      margin-bottom: 20px;
    }

    #bar {
      height: 100%;
      width: 0%;
      background-color: #A362FF; /* Match exactly with AppColors.purple */
    }

    .loader-text {
      font-family: 'Inter', sans-serif;
      color: rgba(255, 255, 255, 0.54);
      font-size: 12px;
      letter-spacing: 2px;
      font-weight: 600;
      margin-left: 5vw;
    }

    @media (max-width: 800px) {
      #num { font-size: 30vw; margin-left: 8vw; letter-spacing: -2px; }
      .loader-text { font-size: 10px; margin-left: 8vw; }
    }
  </style>
</head>
<body>
  <div id="typographic-loader">
    <div class="loader-content">
      <div id="num">000</div>
      <div id="bar-container"><div id="bar"></div></div>
      <div class="loader-text">EZSARTHAK.COM / CRAFTED WITH FLUTTER & AI</div>
    </div>
  </div>
  <div id="loading" style="display: none;"></div>

  <script src="flutter_bootstrap.js" async></script>

  <script>
    (function() {
      const numEl = document.getElementById('num');
      const barEl = document.getElementById('bar');
      const loader = document.getElementById('typographic-loader');
      
      let flutterReady = false;

      // Listen for Flutter's official ready event
      document.addEventListener('flutter-first-frame', function() {
        flutterReady = true;
      });

      let start = null;
      
      function step(timestamp) {
        if (!start) start = timestamp;
        let elapsed = timestamp - start;

        if (flutterReady) {
          // The exact moment Flutter is ready, snap to 100 and fade out!
          numEl.innerText = "100";
          barEl.style.width = '100%';
          
          setTimeout(() => {
            loader.style.opacity = '0';
            setTimeout(() => loader.remove(), 800);
          }, 300); // Brief hold at 100 before fading
          
          return; // Stop the animation loop
        }

        // Asymptotic curve: rockets up fast, then crawls toward 99%
        // At 1s: ~63%, At 2s: ~86%, At 3s: ~95%, At 4s: ~98%
        let percentage = 1 - Math.exp(-elapsed / 1200); 
        let currentNum = Math.floor(99 * percentage);
        
        numEl.innerText = currentNum.toString().padStart(3, '0');
        barEl.style.width = currentNum + '%';

        window.requestAnimationFrame(step);
      }
      window.requestAnimationFrame(step);

      // Ultimate failsafe: If Flutter hasn't fired the ready event after 10 seconds,
      // forcefully hide the loader so the user isn't permanently blocked by a crash.
      setTimeout(() => {
        if (!flutterReady && document.getElementById('typographic-loader')) {
           loader.style.opacity = '0';
           setTimeout(() => loader.remove(), 800);
        }
      }, 10000);
    })();
  </script>
</body>
</html>
